<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Começar – GeoVision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/chatbot.css" />
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #102540, #04070f 55%);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e8edf4;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .shell {
      width: min(520px, 100%);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 2.4rem 2.1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }
    .title {
      font-size: 1.8rem;
      margin: 0 0 0.3rem;
    }
    .subtitle {
      margin: 0 0 1.4rem;
      color: #9fb4d3;
      font-size: 0.95rem;
    }
    .grid { display: grid; gap: 1.2rem; }
    label { display:block; font-size:0.9rem; margin-bottom:0.35rem; color:#d7deea; }
    input, select {
      width: 100%;
      padding: 0.9rem 0.85rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #f2f6ff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    .btn-primary {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(130deg, #22c55e, #38bdf8);
      color: #052010;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .feedback {
      display: none;
      margin-top: 0.8rem;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.93rem;
    }
    .feedback.error { background: rgba(255, 99, 99, 0.12); border: 1px solid rgba(255, 99, 99, 0.4); color: #ff9b9b; }
    .feedback.success { background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.35); color: #b6f4c5; }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem 1.2rem;
      margin-top: 0.4rem;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #d7deea;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"],
    .checkbox-item input[type="radio"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .intent-grid { display: grid; gap: 0.7rem; }
    .intent-card {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      gap: 0.75rem;
      padding: 0.9rem;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.035);
      cursor: pointer;
    }
    .intent-card:has(input:checked) {
      border-color: #38bdf8;
      background: rgba(56,189,248,0.1);
    }
    .intent-card input { width: 1.1rem; height: 1.1rem; margin-top: 0.15rem; }
    .intent-card strong, .intent-card small { display: block; }
    .intent-card small { margin-top: 0.2rem; color: #9fb4d3; line-height: 1.35; }
    .invitation-summary {
      display: none;
      padding: 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(56,189,248,0.35);
      background: rgba(56,189,248,0.08);
      color: #dceeff;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1 class="title">O que quer fazer primeiro?</h1>
    <p class="subtitle" id="welcome-text">Bem-vindo ao GeoVision. Escolha um objetivo; não precisa de escolher um tipo de conta.</p>

    <form id="onboarding-form" class="grid">
      <div>
        <label>Escolha o seu próximo passo</label>
        <div class="intent-grid" id="intent-group">
          <label class="intent-card"><input type="radio" name="intent" value="request_service" checked /><span><strong>Pedir um serviço</strong><small>Descreva a aquisição, análise ou entrega de que precisa.</small></span></label>
          <label class="intent-card"><input type="radio" name="intent" value="monitor_asset" /><span><strong>Monitorizar um ativo</strong><small>Adicione um campo, instalação, corredor, mina, porto ou outro local.</small></span></label>
          <label class="intent-card"><input type="radio" name="intent" value="buy_product" /><span><strong>Comprar um produto</strong><small>Veja equipamentos, sensores e serviços no catálogo.</small></span></label>
          <label class="intent-card"><input type="radio" name="intent" value="view_invitation" /><span><strong>Ver um convite</strong><small>Entre numa organização e abra trabalho que já existe.</small></span></label>
        </div>
      </div>
      <div id="invitation-fields" style="display:none;">
        <label for="invitation-token">Código seguro do convite</label>
        <input id="invitation-token" type="password" autocomplete="off" placeholder="Abra o link recebido ou cole o código" />
        <div id="invitation-summary" class="invitation-summary" aria-live="polite"></div>
      </div>
      <div id="starter-fields">
        <div>
          <label for="org-name">Nome da organização (opcional)</label>
          <input id="org-name" type="text" placeholder="Nome da empresa ou projeto" />
        </div>
        <div style="margin-top:1rem;">
          <label for="account-name">Nome do espaço de trabalho (opcional)</label>
          <input id="account-name" type="text" placeholder="Ex.: Operações – Luanda" />
        </div>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Continuar</button>
    </form>

    <div id="success-box" class="feedback success" role="status" aria-live="polite" aria-hidden="true"></div>
    <div id="error-box" class="feedback error" role="alert" aria-live="assertive" aria-hidden="true"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    const API_BASE = window.API_BASE;
    const successBox = document.getElementById("success-box");
    const errorBox = document.getElementById("error-box");

    function show(box, msg) {
      if (!box) return;
      box.textContent = msg;
      box.style.display = "block";
      box.setAttribute("aria-hidden", "false");
    }
    function hide(box) {
      if (!box) return;
      box.style.display = "none";
      box.textContent = "";
      box.setAttribute("aria-hidden", "true");
    }

    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const linkToken = hashParams.get("invitation");
    if (linkToken) {
      sessionStorage.setItem("gv_pending_invitation", linkToken);
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    const pendingInvitation = linkToken || sessionStorage.getItem("gv_pending_invitation") || "";

    const rawUser = localStorage.getItem("gv_user");
    try {
      const u = rawUser ? JSON.parse(rawUser) : null;
      if (u && u.email) {
        document.getElementById("welcome-text").textContent = `Bem-vindo, ${u.email}. Escolha o resultado que quer obter primeiro.`;
      }
    } catch (_) {}

    const token = localStorage.getItem("gv_token");
    if (!token) {
      window.location.replace("login.html?return=%2Fonboarding.html");
    }

    const invitationFields = document.getElementById("invitation-fields");
    const starterFields = document.getElementById("starter-fields");
    const invitationInput = document.getElementById("invitation-token");
    const invitationSummary = document.getElementById("invitation-summary");
    if (pendingInvitation) invitationInput.value = pendingInvitation;

    function selectedIntent() {
      return (document.querySelector('input[name="intent"]:checked') || {}).value || "request_service";
    }
    function renderIntent() {
      const invitation = selectedIntent() === "view_invitation";
      invitationFields.style.display = invitation ? "block" : "none";
      starterFields.style.display = invitation ? "none" : "block";
    }
    document.querySelectorAll('input[name="intent"]').forEach((r) => r.addEventListener("change", renderIntent));
    if (pendingInvitation) document.querySelector('input[value="view_invitation"]').checked = true;
    renderIntent();

    async function previewInvitation() {
      const invitationToken = invitationInput.value.trim();
      if (!invitationToken) return;
      const response = await fetch(API_BASE + "/invitations/preview", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({token: invitationToken}),
      });
      if (!response.ok) throw new Error("Este convite já não está disponível.");
      const preview = await response.json();
      invitationSummary.textContent = `${preview.organization_name} · ${preview.workspace_name} · acesso ${preview.intended_role}`;
      invitationSummary.style.display = "block";
    }
    if (pendingInvitation && token) previewInvitation().catch((err) => show(errorBox, err.message));

    function webDestination(destination) {
      if (!destination) return "dashboard.html";
      if (destination.kind === "order") return `dashboard.html?order=${encodeURIComponent(destination.target_id || "")}`;
      if (destination.kind === "asset") return `dashboard.html?asset=${encodeURIComponent(destination.target_id || "")}`;
      if (destination.kind === "report") return `dashboard.html?report=${encodeURIComponent(destination.target_id || "")}`;
      if (destination.kind === "service_result") return `dashboard.html?request=${encodeURIComponent(destination.target_id || "")}`;
      return "dashboard.html";
    }

    document.getElementById("onboarding-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hide(errorBox); hide(successBox);

      const orgName = document.getElementById("org-name").value.trim();
      const accountName = document.getElementById("account-name").value.trim();
      const intent = selectedIntent();

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;

      try {
        if (intent === "view_invitation") {
          const invitationToken = invitationInput.value.trim();
          if (!invitationToken) throw new Error("Abra o link do convite ou cole o código seguro.");
          const accepted = await fetch(API_BASE + "/invitations/accept", {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
            body: JSON.stringify({token: invitationToken}),
          });
          if (!accepted.ok) {
            const failure = await accepted.json().catch(() => ({}));
            throw new Error((failure.detail && failure.detail.message) || "Não foi possível aceitar o convite.");
          }
          const result = await accepted.json();
          sessionStorage.removeItem("gv_pending_invitation");
          localStorage.setItem("gv_account_id", result.invitation.destination.workspace_id);
          window.location.replace(webDestination(result.invitation.destination));
          return;
        }
        const res = await fetch(API_BASE + "/auth/onboarding", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
          body: JSON.stringify({
            intent,
            org_name: orgName || null,
            account_name: accountName || null,
          }),
        });

        if (!res.ok) {
          const txt = await res.text().catch(() => null);
          throw new Error(txt || "Não foi possível guardar a configuração.");
        }

        const data = await res.json().catch(() => ({}));
        if (data.access_token) {
          localStorage.setItem("gv_token", data.access_token);
        }
        if (data.user) {
          localStorage.setItem("gv_user", JSON.stringify(data.user));
        }
        try {
          if (data.account && data.account.id) {
            localStorage.setItem('gv_account_id', data.account.id);
          }
        } catch (_) {}
        localStorage.setItem("gv_toast", JSON.stringify({
          msg: "Conta configurada com sucesso.",
          type: "success",
          ts: Date.now(),
        }));

        if (data.user && data.user.role === "admin") window.location.href = "admin.html";
        else if (intent === "buy_product") window.location.href = "loja.html";
        else window.location.href = `dashboard.html?intent=${encodeURIComponent(intent)}`;
      } catch (err) {
        console.error("onboarding", err);
        show(errorBox, (err && err.message) ? err.message : "Erro ao guardar configuração.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
  <script src="assets/js/i18n.js?v=27"></script>
  <script>window.GV_CHAT_API_BASE = window.API_BASE;</script>
  <script src="assets/js/chatbot.js?v=5"></script>
  <script src="assets/js/contacts.js?v=3"></script>
</body>
</html>
