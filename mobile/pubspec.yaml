name: geovision
description: GeoVision — commercial operational platform for iOS and Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure + local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Connectivity (offline-first)
  connectivity_plus: ^6.0.3

  # Charts (KPI sparklines / trends)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  country_state_city: ^0.1.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/guides/
    - assets/images/payments/
    - assets/images/store/
    - assets/demo/

  # Uncomment after adding Inter TTFs to assets/fonts/ (see assets/fonts/README.md)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
