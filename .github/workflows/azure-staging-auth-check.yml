name: Azure staging authentication check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/azure-staging-auth-check.yml'

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    if: github.repository == 'Genovesi-JM/geovision' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate the dedicated staging preflight identity
        uses: azure/login@v2
        with:
          client-id: 9be83428-1c75-4ffb-8e4d-79873c2d59ad
          tenant-id: 69f1c4f2-ab5f-4267-b68b-10c033e56613
          subscription-id: 50874a30-a81d-4c8a-aac7-13564bd1641d
      - name: Verify read-only staging scope
        run: |
          az group show --name rg-geovision-staging-weu --query '{name:name,location:location}' --output json
          printf 'OIDC token exchange and staging resource-group read succeeded. This identity has Reader only; no deployment was attempted.\n' >> "$GITHUB_STEP_SUMMARY"
