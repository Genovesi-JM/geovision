name: Deploy - staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI - delivery gates']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      AZURE_PARAMETERS_FILE: infra/azure/staging.bicepparam
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_DEPLOYMENT_PREFIX: geovision-staging
      AZURE_REGISTER_PROVIDERS: 'false'
      GEOVISION_FRONTEND_BASE_URL: ${{ vars.GEOVISION_FRONTEND_BASE_URL }}
      GEOVISION_CORS_ORIGINS: ${{ vars.GEOVISION_CORS_ORIGINS }}
      GEOVISION_POSTGRES_ADMIN_PASSWORD: ${{ secrets.GEOVISION_POSTGRES_ADMIN_PASSWORD }}
      GEOVISION_SECRET_KEY: ${{ secrets.GEOVISION_SECRET_KEY }}
      GEOVISION_ENCRYPTION_KEY: ${{ secrets.GEOVISION_ENCRYPTION_KEY }}
    steps:
      - name: Enforce main for manual deployments
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo 'Manual staging deployment is permitted only from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy staging with migration-first release ordering
        env:
          GEOVISION_IMAGE_TAG: ${{ env.RELEASE_SHA }}
        run: infra/azure/deploy.sh
      - name: Record non-sensitive deployment evidence
        run: |
          deployed_image="$(az deployment sub show --name "${AZURE_DEPLOYMENT_PREFIX}-runtime" --query properties.outputs.backendImage.value --output tsv)"
          api_url="$(az deployment sub show --name "${AZURE_DEPLOYMENT_PREFIX}-runtime" --query properties.outputs.apiUrl.value --output tsv)"
          printf '### Staging deployment\n\n- Commit: `%s`\n- Image: `%s`\n- API: %s\n' \
            "${RELEASE_SHA}" "${deployed_image}" "${api_url}" >> "${GITHUB_STEP_SUMMARY}"
