name: mobile-ci

on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  android-build:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          cache: true
      - run: flutter pub get
      - name: Build production-configured Android APK
        run: flutter build apk --release --dart-define-from-file=dart_defines/production.json

  ios-build:
    runs-on: macos-14
    needs: analyze-and-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          cache: true
      - run: flutter pub get
      - name: Build production-configured iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file=dart_defines/production.json
