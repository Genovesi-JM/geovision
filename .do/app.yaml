alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- cluster_name: db-postgresql-ams3-28118
  engine: PG
  name: db-postgresql-ams3-28118
  production: true
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: geovision
    match:
      path:
        prefix: /
name: geovisionops
region: ams
services:
- build_command: pip install --upgrade pip && pip install -r requirements.deploy.txt
  environment_slug: python
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db-postgresql-ams3-28118.DATABASE_URL}
  - key: ENV
    scope: RUN_AND_BUILD_TIME
    value: prod
  - key: PORT
    scope: RUN_TIME
    value: "8080"
  - key: CORS_ORIGINS
    scope: RUN_TIME
    value: https://geovisionops.com,https://www.geovisionops.com
  - key: FRONTEND_BASE
    scope: RUN_TIME
    value: https://geovisionops.com
  - key: BACKEND_BASE
    scope: RUN_TIME
    value: https://api.geovisionops.com
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET
  - key: ADMIN_EMAILS
    scope: RUN_TIME
    type: SECRET
  - key: IDENTITY_PROVIDER
    scope: RUN_TIME
    value: internal
  - key: INTERNAL_TOKEN_ISSUER
    scope: RUN_TIME
    value: geovision
  - key: INTERNAL_TOKEN_AUDIENCE
    scope: RUN_TIME
    value: geovision-api
  - key: ACCEPT_LEGACY_ACCESS_TOKENS
    scope: RUN_TIME
    value: "true"
  - key: EXTERNAL_IDENTITY_SESSION_MAX_HOURS
    scope: RUN_TIME
    value: "24"
  - key: IDENTITY_AUTO_LINK_VERIFIED_EMAIL
    scope: RUN_TIME
    value: "false"
  - key: ENTRA_EXTERNAL_ID_ISSUER
    scope: RUN_TIME
    type: SECRET
  - key: ENTRA_EXTERNAL_ID_AUDIENCE
    scope: RUN_TIME
    type: SECRET
  - key: ENTRA_EXTERNAL_ID_TENANT_ID
    scope: RUN_TIME
    type: SECRET
  - key: ENTRA_EXTERNAL_ID_DISCOVERY_URL
    scope: RUN_TIME
    type: SECRET
  - key: ENTRA_EXTERNAL_ID_REQUIRED_SCOPE
    scope: RUN_TIME
    value: access_as_user
  - key: ENTRA_EXTERNAL_ID_AUTHORIZED_PARTY
    scope: RUN_TIME
    type: SECRET
  - key: ENTRA_EXTERNAL_ID_CLOCK_SKEW_SECONDS
    scope: RUN_TIME
    value: "60"
  - key: ENTRA_EXTERNAL_ID_JWKS_CACHE_SECONDS
    scope: RUN_TIME
    value: "3600"
  - key: ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
  - key: ERP_PROVIDER
    scope: RUN_TIME
    value: odoo
  - key: ODOO_BASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: ODOO_DATABASE
    scope: RUN_TIME
    type: SECRET
  - key: ODOO_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: ODOO_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: NOTIFICATION_PROVIDER
    scope: RUN_TIME
    value: smtp
  - key: SMTP_HOST
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_PORT
    scope: RUN_TIME
    value: "587"
  - key: SMTP_USER
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_PASSWORD
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_FROM
    scope: RUN_TIME
    type: SECRET
  - key: SMTP_USE_TLS
    scope: RUN_TIME
    value: "true"
  - key: GOOGLE_CLIENT_ID
    scope: RUN_TIME
    type: SECRET
  - key: GOOGLE_CLIENT_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: MICROSOFT_CLIENT_ID
    scope: RUN_TIME
    type: SECRET
  - key: MICROSOFT_CLIENT_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: MICROSOFT_TENANT_ID
    scope: RUN_TIME
    type: SECRET
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: OPENAI_MODEL
    scope: RUN_TIME
    value: gpt-4o-mini
  - key: STRIPE_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_PUBLISHABLE_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  github:
    branch: main
    deploy_on_push: true
    repo: Genovesi-JM/geovision
  health_check:
    failure_threshold: 5
    http_path: /ready
    initial_delay_seconds: 30
    period_seconds: 10
    port: 8080
    success_threshold: 1
    timeout_seconds: 5
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-2gb
  liveness_health_check:
    failure_threshold: 6
    http_path: /health
    initial_delay_seconds: 30
    period_seconds: 10
    port: 8080
    success_threshold: 1
    timeout_seconds: 5
  name: geovision
  run_command: python start.py
  source_dir: /backend
