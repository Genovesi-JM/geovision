<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <title>GeoVision - A ligar...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <style>
    body { margin:0; display:grid; place-items:center; min-height:100vh; font-family: "Inter", system-ui, sans-serif; background:#0b1624; color:#e8edf4; }
    .card { background:rgba(255,255,255,0.06); padding:1.4rem 1.8rem; border-radius:14px; border:1px solid rgba(255,255,255,0.08); box-shadow:0 16px 40px rgba(0,0,0,0.4); max-width:360px; text-align:center; }
    .spinner { width:26px; height:26px; border-radius:50%; border:3px solid rgba(255,255,255,0.2); border-top-color:#38bdf8; animation: spin 0.8s linear infinite; margin:0 auto 0.6rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div id="msg">A ligar à sua conta...</div>
  </div>

  <script src="assets/js/config.js?v=5"></script>
  <script>
    (async function(){
      function getParams() {
        // Backend callbacks place credentials only in the fragment so they
        // never reach HTTP logs, Referer headers, or server-side history.
        var raw = window.location.hash ? window.location.hash.substring(1) : '';
        const p = new URLSearchParams(raw);
        return {
          token: p.get('token'),
          refresh_token: p.get('refresh_token') || '',
          provider: p.get('provider') || '',
          browser_nonce: p.get('browser_nonce') || '',
          redirect: p.get('redirect') || '/dashboard.html',
        };
      }
      const { token, refresh_token, provider, browser_nonce, redirect } = getParams();
      // Clear fragments and obsolete query credentials immediately.
      if (window.location.hash || window.location.search) {
        try { history.replaceState(null, '', window.location.pathname); } catch(_){}
      }
      if (!token) {
        document.getElementById('msg').textContent = 'Token ausente. Volta ao login.';
        setTimeout(() => window.location.replace('login.html'), 1200);
        return;
      }

      const nonceKey = (provider === 'google' || provider === 'microsoft')
        ? `gv_oauth_nonce_${provider}`
        : '';
      let expectedNonce = '';
      try {
        expectedNonce = nonceKey ? (sessionStorage.getItem(nonceKey) || '') : '';
        if (nonceKey) sessionStorage.removeItem(nonceKey);
      } catch (_) {}
      if (!expectedNonce || !browser_nonce || expectedNonce !== browser_nonce) {
        document.getElementById('msg').textContent = 'A sessão não pertence a este pedido de login. Volta ao login.';
        setTimeout(() => window.location.replace('login.html'), 1200);
        return;
      }

      let profile;
      try {
        const response = await fetch(`${window.API_BASE}/auth/me`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${token}` },
          cache: 'no-store',
          redirect: 'error',
        });
        if (!response.ok) throw new Error('invalid callback token');
        profile = await response.json();
        if (!profile || !profile.id || !profile.email || !profile.role) {
          throw new Error('invalid callback profile');
        }

        localStorage.setItem('gv_token', token);
        if (refresh_token) localStorage.setItem('gv_refresh_token', refresh_token);
        else localStorage.removeItem('gv_refresh_token');
        localStorage.setItem('gv_user', JSON.stringify({
          id: profile.id,
          email: profile.email,
          name: profile.name || profile.full_name || '',
          role: profile.role,
        }));
        localStorage.setItem('gv_email', profile.email);
        localStorage.setItem('gv_role', profile.role);
        if (profile.name || profile.full_name) {
          localStorage.setItem('gv_name', profile.name || profile.full_name);
        }
        if (profile.account_id) localStorage.setItem('gv_account_id', profile.account_id);
        if (profile.account_name) localStorage.setItem('gv_account_name', profile.account_name);
        localStorage.setItem('gv_toast', JSON.stringify({ msg: 'Login concluído com sucesso', type: 'success', ts: Date.now() }));
      } catch (e) {
        document.getElementById('msg').textContent = 'Não foi possível validar a sessão. Volta ao login.';
        setTimeout(() => window.location.replace('login.html'), 1200);
        return;
      }

      const allowedRedirects = {
        '/admin.html': 'admin.html',
        '/dashboard.html': 'dashboard.html',
        '/onboarding.html': 'onboarding.html',
      };
      const targetPage = allowedRedirects[redirect] || 'dashboard.html';
      window.location.replace(new URL(targetPage, window.location.href).href);
    })();
  </script>
</body>
</html>
