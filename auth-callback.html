<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <title>GeoVision - Conectando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <style>
    body { margin:0; display:grid; place-items:center; min-height:100vh; font-family: "Inter", system-ui, sans-serif; background:#0b1624; color:#e8edf4; }
    .card { background:rgba(255,255,255,0.06); padding:1.4rem 1.8rem; border-radius:14px; border:1px solid rgba(255,255,255,0.08); box-shadow:0 16px 40px rgba(0,0,0,0.4); max-width:360px; text-align:center; }
    .spinner { width:26px; height:26px; border-radius:50%; border:3px solid rgba(255,255,255,0.2); border-top-color:#38bdf8; animation: spin 0.8s linear infinite; margin:0 auto 0.6rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div id="msg">Conectando con su cuenta...</div>
  </div>

  <script src="assets/js/config.js?v=5"></script>
  <script src="assets/js/session.js?v=2"></script>
  <script>
    (async function(){
      function getParams() {
        // Backend callbacks place credentials only in the fragment so they
        // never reach HTTP logs, Referer headers, or server-side history.
        var raw = window.location.hash ? window.location.hash.substring(1) : '';
        const p = new URLSearchParams(raw);
        return {
          token: p.get('token'),
          provider: p.get('provider') || '',
          browser_nonce: p.get('browser_nonce') || '',
          redirect: p.get('redirect') || '',
        };
      }
      const { token, provider, browser_nonce, redirect } = getParams();
      // Clear fragments and obsolete query credentials immediately.
      if (window.location.hash || window.location.search) {
        try { history.replaceState(null, '', window.location.pathname); } catch(_){}
      }
      if (!token) {
        document.getElementById('msg').textContent = 'Falta el token. Vuelva al inicio de sesión.';
        setTimeout(() => window.location.replace('login.html'), 1200);
        return;
      }

      const nonceKey = (provider === 'google' || provider === 'microsoft')
        ? `gv_oauth_nonce_${provider}`
        : '';
      let expectedNonce = '';
      try {
        expectedNonce = nonceKey ? (sessionStorage.getItem(nonceKey) || '') : '';
        if (nonceKey) sessionStorage.removeItem(nonceKey);
      } catch (_) {}
      if (!expectedNonce || !browser_nonce || expectedNonce !== browser_nonce) {
        document.getElementById('msg').textContent = 'La sesión no corresponde a esta solicitud. Vuelva al inicio de sesión.';
        setTimeout(() => window.location.replace('login.html'), 1200);
        return;
      }

      let profile;
      try {
        profile = await window.GV.session.verify(token);
        window.GV.session.persist(token, profile);
        localStorage.setItem('gv_toast', JSON.stringify({ msg: 'Sesión iniciada correctamente', type: 'success', ts: Date.now() }));
      } catch (e) {
        document.getElementById('msg').textContent = 'No se pudo validar la sesión. Vuelva al inicio de sesión.';
        setTimeout(() => window.location.replace('login.html'), 1200);
        return;
      }

      // OAuth's legacy redirect may reflect user.role rather than an assigned
      // internal role. The verified profile determines the staff landing page.
      const targetPage = window.GV.session.destination(profile, window.GV.session.isInternal(profile) ? '' : redirect);
      window.location.replace(new URL(targetPage, window.location.href).href);
    })();
  </script>
</body>
</html>
